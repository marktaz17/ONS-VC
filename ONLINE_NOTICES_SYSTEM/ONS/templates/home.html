{% extends 'base.html' %}
{% load static %}
{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- <script src="{% static 'js/datatable.js' %}"></script> -->
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>
<style>
    * { /*FONT FOR FIELD*/
      font-family: 'Segoe UI', Tahoma, sans-serif;
      font-size: 12px;
    }
    .container, .container-lg, .container-md, .container-sm, .container-xl, .container-xxl {
        max-width: 98%;
    }

    #example th, #example td {
       
        border: 1px solid #ddd; /* Optional: border for better visibility */
    }
  
    tfoot {
        display: table-header-group;
        text-align: center;
    }
 
    tfoot input {
        width: 100%;
        padding: 3px;   
    }
    tfoot {
        display: table-header-group;
        text-align: left;
    }
   .btn-secondary {
    background-color: #0d6efd; /* Change the background color to green */
    border-color: #0d6efd; /* Change the border color to match */
    color: white; /* Ensure the text color is white for contrast */
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Add shadow effect */
    transition: all 0.3s ease; /* Smooth transition for hover effects */
}

.btn-secondary:hover {
    background-color: #0b5ed7; /* Darker green for hover effect */
    border-color: #0b5ed7; /* Match the border color on hover */
    color: white; /* Ensure the text remains white on hover */
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3); /* Increase shadow on hover */
}
.btn-danger {
    background-color: #dc3545; /* Change the background color to green */
    border-color: #dc3545; /* Change the border color to match */
    color: white; /* Ensure the text color is white for contrast */
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Add shadow effect */
    transition: all 0.3s ease; /* Smooth transition for hover effects */
}

.btn-danger:hover {
    background-color: #bb2d3b; /* Darker green for hover effect */
    border-color: #bb2d3b; /* Match the border color on hover */
    color: white; /* Ensure the text remains white on hover */
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3); /* Increase shadow on hover */
}
</style>
{% if user.is_authenticated %}
<h3 style="margin-bottom: -10px;">
    DATA TABLE
</h3>
<a class="btn btn-success" style="float: right;" href="{% url 'add' %}">Add</a>
<br>
<br>
<table id="example" class="display table-bordered" style="width:100%">
    <thead>
        <tr>
            <th style="text-align: center;">Date Stamp</th>
            <th style="text-align: center;">Pin Number</th>
            <th style="text-align: center;">Building Owner</th>
            <th style="text-align: center;">Barangay</th>
            <th style="text-align: center;">Status</th>
            <th style="text-align: center;">Action</th>
        </tr>
    </thead>
    <tfoot>
        <tr>
        <th><input type="text" disabled></th>
        <th><input type="text"></th>
        <th><input type="text"></th>
        <th><input type="text"></th>
        <th><input type="text"></th>
        <th><input type="text" disabled></th>
        </tr>
    </tfoot>
    <tbody>
        
    </tbody>
</table>

    {% endif %}

<script>
$(document).ready(function() {
    var table = $('#example').DataTable({
        processing: true,
        serverSide: true,
        ajax: {
            url: '{% url "home" %}',
            type: 'GET'
        },
        columns: [

            { width: "100px", data: 'created_at', render: function(data, type, row, meta) {
                return '<div style="text-align: center;">' + data + '</div>';
            }},
            { width: "125px", data: 'pin_number', render: function(data, type, row, meta) {
                return '<div style="text-align: center;">' + data + '</div>';
            }},
            { width: "350px", data: 'building_owner', render: function(data, type, row, meta) {
                return '<div style="text-align: left;">' + data + '</div>';
            }},
            { width: "50px", data: 'brgy_pin', render: function(data, type, row, meta) {
                return '<div style="text-align: center;">' + data + '</div>';
            }},
            { width: "50px", data: 'final_status', render: function(data, type, row, meta) {
                return '<div style="text-align: center;">' + data + '</div>';
            }},
            { width: "120px", data: 'action', orderable: false, searchable: false }
        ],
        initComplete: function () {
            // Set up column-specific search inputs
            this.api().columns().every(function () {
                var column = this;
                $('input', this.footer()).on('keyup change clear', function () {
                    if (column.search() !== this.value) {
                        column.search(this.value).draw();
                    }
                });
            });
        }
    });
});
</script>
{% endblock %}
