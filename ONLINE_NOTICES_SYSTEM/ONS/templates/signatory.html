{% extends 'base.html' %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.css" rel="stylesheet">
<style>
   

        .fixed-button-container {
        position: fixed; /* Fixes the button in place */
        top: 20px; /* Adjust as needed */
        right: 20px; /* Adjust as needed */
        z-index: 1000; /* Ensures it stays above other content */
    }

    .table-container {
        margin-top: 70px; /* Adjust based on button height */
        max-height: calc(100vh - 100px); /* Adjust as needed for your layout */
        overflow-y: auto; /* Enable vertical scrolling */
        position: relative; /* Required for sticky positioning */
    }

    #example {
        width: 100%; /* Ensure the table takes full width */
        border-collapse: collapse; /* Optional: collapse borders */
    }

    #example thead th,
    #example tfoot th {
        position: sticky; /* Make the header and footer sticky */
        top: 0; /* For the header */
        background-color: white; /* Background color for visibility */
        z-index: 10; /* Ensure it stays above other content */
    }

    #example tfoot th {
        bottom: 0; /* Position footer at the bottom */
        z-index: 10; /* Ensure it stays above other content */
    }

    #example th, #example td {
        padding: 8px; /* Add some padding */
        text-align: left; /* Align text to the left */
        border: 1px solid #ddd; /* Optional: border for better visibility */
    }

    
    tfoot input {
        width: 100%;
        padding: 3px;
        box-sizing: border-box;
        border: 1px solid #aaa;
    }
    tfoot {
        display: table-header-group;
        text-align: left;
    }
    td {
        text-align: left;
    }

    div.dt-container .dt-search input {
    
    display: none;
    }
    div.dt-container .dt-input {
    
    visibility: hidden;
    }
    div.dt-container .dt-length,
    div.dt-container .dt-search,
    div.dt-container .dt-info,
    div.dt-container .dt-processing,
    div.dt-container .dt-paging {
        display: none;
    }
</style>
{% if user.is_authenticated %}
<h3>
    Signatory Setup
</h3>
<!-- <a class="btn btn-success" style="float: right;" href="{% url 'add_signatory' %}">Add</a> -->
<table id="example" class="display table-bordered" style="width:100%">
    <thead>
        <tr>
            <th style="text-align: center;">Signatory</th>
            <th style="text-align: center;">Position</th>
            <th style="text-align: center;">Action</th>
        </tr>
    </thead>
    <tfoot>
        <tr> 
        </tr>
    </tfoot>    
    <tbody>
    {% for records in records %}
        <tr>
            <td style="text-align: left;">{{ records.signatory }}</td>
            <td style="text-align: left;">{{ records.position }}</td>
            <td style="text-align: center;">
            <a href="{% url 'update_signatory' records.id %}" class=" btn btn-primary" style="color: #fff;" title="Update">
                <i class="bx bx-edit"></i>
                </a>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>

    {% else %}
        <div class="col-md-6 offset-md-3">
            <form method="POST" action="{% url 'home' %}">
                {% csrf_token %} <!-- for security purpose  -->
                <br>
                <br>
                <br>
                <br>
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Username" name="userName" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" placeholder="Password" name="passWord" required>
                </div>
                        
                <button type="submit" class="btn btn-success">Login</button>
            </form>

        </div>
    {% endif %}
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>
<script>
    new DataTable('#example', {
    initComplete: function () {
        this.api()
            .columns()
            .every(function () {
                let column = this;
                let title = column.footer().textContent;
    
                // Create input element
                let input = document.createElement('input');
                input.placeholder = title;
                column.footer().replaceChildren(input);
    
                // Event listener for user input
                input.addEventListener('keyup', () => {
                    if (column.search() !== this.value) {
                        column.search(input.value).draw();
                    }
                });
            });
        }
    });
</script>
{% endblock %}
