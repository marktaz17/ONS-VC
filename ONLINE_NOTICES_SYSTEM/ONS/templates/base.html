{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ONLINE NOTICE SYSTEM</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" href="{% static 'ONS/ceo.png' %}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
<style>
    /* Loading Spinner Styles */
    .loader {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none; /* Initially hidden */
        z-index: 9999; /* Ensure it's on top */
    }

    .loader .spinner {
        border: 8px solid #f3f3f3; /* Light grey */
        border-top: 8px solid #08a31a; /* Blue */
        border-radius: 50%;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
  <body>
  <div class="loader" id="loader">
      <div class="spinner"></div>
  </div>
    {% if user.is_authenticated %}
        {% include 'navbar.html' %}
    {% endif %}
    <div class="container">
        <br>
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}

        {% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<script>
        let timeout;
        const logoutTime = 3600 * 1000; // 10 seconds in milliseconds

        function resetTimer() {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                alert("You have been logged out due to inactivity.");
                window.location.href = "{% url 'login_page' %}"; // Redirect to login page
            }, logoutTime);
        }

        // Reset the timer on user activity
        document.addEventListener("mousemove", resetTimer);
        document.addEventListener("keypress", resetTimer);

        resetTimer(); // Initialize the timer
    </script>
    <script>
  // Show loader on page load
  window.onload = function() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('content').style.display = 'block';
  };

  // Show loader before page unload
  window.onbeforeunload = function() {
      document.getElementById('loader').style.display = 'block';
  };
</script>
</body>
</html>
